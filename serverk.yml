# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: BotPackage

metadata:
  id: bot-node
  name:
    ar: بوت نود
    en: Node bot
  description:
    ar: اربط ريبو GitHub أو ارفع كود بوتك، ونتعرف على طريقة تشغيله تلقائيًا. أضف متغيراتك، وانشر بضغطة واحدة، وتابع كل ما يطبعه بوتك لحظة بلحظة.
    en: Link a GitHub repository or upload your bot's code, and we work out how to run it. Add your variables, deploy in one click, and follow everything your bot prints, live.
  tagline:
    ar: شغّل بوت ديسكورد أو تيليقرام الذي كتبته بـ Node.js، ليبقى شغّالًا ليلًا ونهارًا
    en: Run the Discord or Telegram bot you wrote in Node.js, day and night
  logo: assets/logo.webp
  banner: assets/banner.webp

resources:
  minMemoryMb: 512
  recommendedMemoryMb: 1024
  minDiskMb: 2048

container:
  image: serverkgg/bot-node
  runtime:
    platform: linux
    installBudgetMinutes: 15
    bootBudgetMinutes: 15
    shmMb: 64
    pidsLimit: 256
  ports: []

environment:
  vault: true

backup:
  except:
    - "**/node_modules/**"
    - .serverk/cache/**
    - .serverk/history/**
    - .serverk/snapshots/**
    - .npm/**
    - .cache/**
    - logs/**
    - "**/*.log"

reset:
  keep: []

files:
  protected:
    - .serverk/**
  notable:
    - match: package.json
      label:
        ar: ملف المشروع
        en: Project file
      icon: box
      color: "#5fa04e"
      restart: true
      note:
        ar: مكتبات بوتك وأمر التشغيل (start). نثبّت المكتبات التي تغيّرت تلقائيًا في كل نشر.
        en: Your bot's dependencies and its start script. We install whatever changed on every deploy.
    - match: package-lock.json
      label:
        ar: قفل المكتبات
        en: Lockfile
      icon: shield
      color: "#8d99ae"
      note:
        ar: يحدد إصدارات المكتبات بالضبط. نعيد التثبيت عند تغيّره، فلا تعدّله يدويًا.
        en: Pins the exact dependency versions. We reinstall when it changes, so don't edit it by hand.
    - match: .env
      label:
        ar: المتغيرات
        en: Environment
      icon: settings
      color: "#e0a458"
      note:
        ar: مكان المتغيرات صفحة المتغيرات في إعدادات بوتك، وليس هذا الملف. ما تضيفه هناك يصل إلى بوتك بالاسم نفسه، وتُحفظ القيم الحساسة مشفّرة.
        en: Variables belong in your bot's settings, not here. Whatever you add there reaches your bot under the same name, and sensitive values are stored encrypted.
    - match: serverk.json
      label:
        ar: إعدادات Serverk
        en: Serverk settings
      icon: settings
      color: "#4cc9f0"
      restart: true
      note:
        ar: وقت التشغيل والمنصة وأمر التثبيت وأمر التشغيل لبوتك. إذا وُجد الملف، نعتمد عليه بدلًا مما نكتشفه من الكود.
        en: Your bot's runtime, platform, and install and start commands. When the file is there, it wins over what we detect from the code.
    - match: node_modules
      label:
        ar: المكتبات
        en: Dependencies
      icon: puzzle
      color: "#c77dff"
      note:
        ar: المكتبات المثبّتة. لا تحتاج إلى تعديلها، وإذا تلفت فأعد تثبيتها من صفحة بوتك.
        en: The installed dependencies. You never need to touch them, and if they break, reinstall them from your bot's page.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: deploy
    name:
      ar: النشر
      en: Deploy
  - id: tokens
    name:
      ar: التوكن والمتغيرات
      en: Tokens and variables
  - id: troubleshoot
    name:
      ar: حل المشاكل
      en: Troubleshooting

guides:
  - id: getting-started
    title:
      ar: شغّل بوتك أول مرة
      en: Run your bot for the first time
    summary:
      ar: من صفحة واحدة إلى أول سطر يطبعه بوتك، خطوة بخطوة.
      en: From one page to the first line your bot prints, step by step.
    tags:
      - start
    surfaces:
      - overview
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
  - id: environment-variables
    title:
      ar: أضف التوكن والمتغيرات
      en: Add the token and your variables
    summary:
      ar: أين يوضع التوكن، وكيف يصل كل متغير إلى بوتك بالاسم نفسه.
      en: Where the token goes, and how every variable reaches your bot under its own name.
    tags:
      - tokens
      - start
    surfaces:
      - overview
      - console
    bodyPath:
      ar: guides/environment-variables/ar.md
      en: guides/environment-variables/en.md
  - id: connect-github
    title:
      ar: اربط بوتك بريبو GitHub
      en: Link your bot to a GitHub repository
    summary:
      ar: كل push على الفرع ينشر بوتك تلقائيًا، والريبو الخاص مدعوم دون توكن.
      en: Every push to the branch deploys your bot, and private repositories work without a token.
    tags:
      - deploy
    surfaces:
      - overview
      - panel
    bodyPath:
      ar: guides/connect-github/ar.md
      en: guides/connect-github/en.md
  - id: deployments
    title:
      ar: النشرات والرجوع إلى إصدار سابق
      en: Deployments and rolling back
    summary:
      ar: ما يحدث في كل نشر، وكيف ترجع بوتك إلى آخر إصدار كان شغّالًا.
      en: What happens in each deployment, and how to take your bot back to the last version that worked.
    tags:
      - deploy
    surfaces:
      - overview
      - console
    bodyPath:
      ar: guides/deployments/ar.md
      en: guides/deployments/en.md
  - id: upload-zip
    title:
      ar: ارفع كود بوتك دون ريبو
      en: Upload your bot's code without a repository
    summary:
      ar: ارفع مجلد بوتك أو ملف zip، وانشر إصدارًا جديدًا كلما عدّلت.
      en: Upload your bot folder or a zip, and ship a new version whenever you change it.
    tags:
      - deploy
    surfaces:
      - files
      - overview
    bodyPath:
      ar: guides/upload-zip/ar.md
      en: guides/upload-zip/en.md
  - id: discord-token
    title:
      ar: أين تجد توكن بوت ديسكورد
      en: Where to find your Discord bot token
    summary:
      ar: من Developer Portal إلى التوكن في متغيرات بوتك، ولماذا لا تستخدم توكن حسابك الشخصي.
      en: From the Developer Portal to the token in your bot's variables, and why you never use your personal account token.
    tags:
      - tokens
    surfaces:
      - overview
      - panel
    bodyPath:
      ar: guides/discord-token/ar.md
      en: guides/discord-token/en.md
  - id: telegram-token
    title:
      ar: أين تجد توكن بوت تيليقرام
      en: Where to find your Telegram bot token
    summary:
      ar: أنشئ بوتك من BotFather وأضف التوكن إلى متغيراته خلال دقيقة.
      en: Create your bot with BotFather and put its token in your variables in a minute.
    tags:
      - tokens
    surfaces:
      - overview
      - panel
    bodyPath:
      ar: guides/telegram-token/ar.md
      en: guides/telegram-token/en.md
  - id: read-the-logs
    title:
      ar: اقرأ الكونسول وافهم ما حدث
      en: Read the console and work out what happened
    summary:
      ar: معنى سطور serverk، وكيف تجد سبب الخطأ عندما يفشل النشر أو يتعطّل بوتك.
      en: What the serverk lines mean, and how to find the cause when a deployment fails or your bot crashes.
    tags:
      - troubleshoot
    surfaces:
      - console
      - overview
    bodyPath:
      ar: guides/read-the-logs/ar.md
      en: guides/read-the-logs/en.md
